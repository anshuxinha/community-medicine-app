name: Seed Updates Feed

on:
  workflow_dispatch:
    inputs:
      feed:
        description: "Which Firestore Updates feed to seed"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth firebase-admin

      - name: Publish local updates JSON to Firestore (no Expo push)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_PROJECT: community-med-app
        run: python scripts/fetch_updates.py --seed-only --feed "${{ inputs.feed }}"
