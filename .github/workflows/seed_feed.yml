name: Seed Updates Feed

on:
  workflow_dispatch:
    inputs:
      feed:
        description: "Which Firestore feed to seed (Updates = production, PH Digest = articles)"
        required: true
        type: choice
        options:
          - articles
          - production

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require explicit feed input
        env:
          FEED: ${{ inputs.feed }}
        run: |
          case "$FEED" in
            articles|production) echo "Seeding feed: $FEED" ;;
            *) echo "::error::feed input must be 'articles' or 'production' (got '$FEED'). No default is allowed."; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth firebase-admin

      - name: Publish local JSON to Firestore (no Expo push)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_PROJECT: community-med-app
          FEED: ${{ inputs.feed }}
        run: python scripts/fetch_updates.py --seed-only --feed "$FEED"
