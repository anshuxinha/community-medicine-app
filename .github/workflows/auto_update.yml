name: Auto Update Health Guidelines

on:
  schedule:
    - cron: "30 4 * * *" # Runs daily at 10:00 AM IST (04:30 UTC)
  workflow_dispatch: # Allows manual triggering from GitHub Actions UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # firebase-admin: publish appContent/updatesFeed from fetch_updates.py
          pip install requests beautifulsoup4 google-auth firebase-admin

      - name: Run Fetch Script
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_KEY }}
          # Required so updates land in Firestore (app reads remote feed first).
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_PROJECT: community-med-app
        # Scrape + publish Firestore feed + Expo push for brand-new links only.
        run: python scripts/fetch_updates.py

      - name: Run Library Verification Review
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_PROJECT: community-med-app
        run: python scripts/verify_mock_data.py

      # Keep bundled JSON in git as scrape dedup + offline fallback seed.
      # Do not OTA: the app reads appContent/updatesFeed from Firestore first.
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/updates.json src/data/updates_archive.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update national health guidelines"
            git pull --rebase origin main
            git push origin main
          fi
